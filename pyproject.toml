[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jupyterhub-storage-usage"
version = "0.1.1"
description = "JupyterHub service: monitor per-user storage, cull servers over limit, show dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "jupyterhub>=4.0",
    "tornado>=6.0",
    "aiohttp>=3.8",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
jupyterhub-storage-usage = "jupyterhub_storage_usage.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["jupyterhub_storage_usage"]

[tool.hatch.build.targets.sdist]
include = ["jupyterhub_storage_usage", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
